name: Accordance Ai
description: Accordance (operated by Agnetic Labs Inc.) is a San Francisco frontier AI platform built
  for tax, audit, and accounting professionals. Founded by researchers from the Stanford AI Lab, it provides
  a firmwide agentic AI platform that performs tax research with authoritative code, context, and citations,
  complex accounting analysis, and audit insight — with visible reasoning and verifiable source citations.
  Accordance is SOC 2 Type II certified, never trains on customer data, and is backed by Menlo Ventures,
  Khosla Ventures, General Catalyst, Sequoia Capital, Bain Capital Ventures, and New Enterprise Associates.
  The product surface is the Accordance application (app.accordance.ai); no public developer API is currently
  documented.
